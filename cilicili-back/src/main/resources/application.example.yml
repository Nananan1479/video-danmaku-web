###########运行的端口号
server:
  port: 6060

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://localhost:3306/cili_videodb
    driver-class-name: com.mysql.cj.jdbc.Driver

    ############## 替换为自己的数据库用户名和密码 ##############
    username: your_db_username
    password: your_db_password

    druid: #定义数据库连接池所需要的相关配置项
      initial-size: 5  #初始化连接池大小
      min-idle: 10    #最小维持的连接池大小
      max-active: 50   #最大可提供的连接数量
      max-wait: 60000   #最长的等待时间

      time-between-eviction-runs-millis: 6000  #关闭空闲连接间隔
      min-evictable-idle-time-millis: 30000  #连接最小的生存时间
      validation-query: SELECT 1 FROM DUAL        #验证查询  数据库的状态检测
      test-while-idle: true              #判断连接是否可用
      test-on-borrow: false              # 在获得连接之前是否要进行测试
      test-on-return: false              # 在归还连接之前是否要进行测试
      pool-prepared-statements: false     #不缓存PSTMT
      max-pool-prepared-statement-per-connection-size: 20  #配置PSTMT缓存个数

      #
      #      stat:  #监控配置
      #        merge-sql:true  #统计相同的SQL命令
      #        log-slow-sql:true  #记录慢SQL
      #        slow-sql-millis:2000   #n慢SQL执行时间标准
      # Spring 监控，利用aop 对指定接口的执行时间，jdbc数进行记录
      aop-patterns: "com.springboot.template.dao.*"
      ########### 启用内置过滤器（第一个 stat必须，否则监控不到SQL）##########
      filters: stat,wall,log4j2
      # 自己配置监控统计拦截的filter
      filter:
        # 开启druiddatasource的状态监控
        stat:
          enabled: true
          db-type: mysql
          # 开启慢sql监控，超过2s 就认为是慢sql，记录到日志中
          log-slow-sql: true
          slow-sql-millis: 2000
        # 日志监控，使用slf4j 进行日志输出
        slf4j:
          enabled: true
          statement-log-error-enabled: true
          statement-create-after-log-enabled: false
          statement-close-after-log-enabled: false
          result-set-open-after-log-enabled: false
          result-set-close-after-log-enabled: false
      ########## 配置WebStatFilter，用于采集web关联监控的数据 ##########
      web-stat-filter:
        enabled: true                   # 启动 StatFilter
        url-pattern: /*                 # 过滤所有url
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" # 排除一些不必要的url
        session-stat-enable: true       # 开启session统计功能
        session-stat-max-count: 1000    # session的最大个数,默认100
      ########## 配置StatViewServlet（监控页面），用于展示Druid的统计信息 ##########
      stat-view-servlet:
        enabled: true                   # 启用StatViewServlet
        url-pattern: /druid/*           # 访问内置监控页面的路径，内置监控页面的首页是/druid/index.html
        reset-enable: false              # 不允许清空统计数据,重新计算
        login-username: root            # 配置监控页面访问密码
        login-password: 123
        allow: 127.0.0.1           # 允许访问的地址，如果allow没有配置或者为空，则允许所有访问
        deny:
  mvc:
    static-path-pattern: /picture/**

mybatis-plus:
  mapper-locations: classpath*:META-INF.mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true    # 自动下划线转驼峰 (created_at -> createdAt)
  global-config:
    db-config:
      id-type: auto

